name: tache2 tests

on:
  push:
    branches: [ tache2 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      # ChatUniTest n'est pas execute ici (il a besoin d'Ollama en local).
      # On execute les tests originaux, generes et manuels des 3 classes etudiees.
      - name: Tests des classes de la tache 2
        run: >
          mvn -B -pl tika-core -am test
          "-Dtest=EndianUtils*Test,FilenameUtils*Test,MediaType*Test"
          -Dsurefire.failIfNoSpecifiedTests=false
          "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
